[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "climbing-monkey-backend"
version = "0.1.0"
description = "Evidence-first climbing profiles and monkey quests"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]
pose = ["mediapipe>=0.10.21,<0.11", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
