name: Backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install -c backend/constraints.txt -e 'backend[test]'
      - run: python -m pytest backend/tests --cov=climbing_monkey --cov-report=term-missing
      - run: ruff check backend/src backend/tests
      - run: ruff format --check backend/src backend/tests
